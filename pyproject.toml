[project]
name = "whoop-mcp"
version = "0.1.0"
description = "Servidor MCP (stdio) para la API publica de WHOOP (v2), construido con FastMCP"
authors = [{ name = "Andres Zamora", email = "azamorar01@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastmcp (>=2.0,<3.0)",
    "requests (>=2.31,<3.0)",
    "python-dotenv (>=1.0,<2.0)",
]

[project.scripts]
whoop-mcp = "whoop_mcp.server:main"
whoop-auth = "whoop_mcp.auth_cli:main"

[tool.poetry]
packages = [{ include = "whoop_mcp", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
